<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <style>
      .eyebrow { fill:#93c5fd; font:700 18px Arial, Helvetica, sans-serif; letter-spacing:2px; }
      .title { fill:#f8fafc; font:700 54px Arial, Helvetica, sans-serif; letter-spacing:-1px; }
      .body { fill:#cbd5e1; font:400 20px Arial, Helvetica, sans-serif; }
      .cardTitle { fill:#f8fafc; font:700 24px Arial, Helvetica, sans-serif; }
      .cardBody { fill:#cbd5e1; font:400 18px Arial, Helvetica, sans-serif; }
      .big { fill:#08111f; font:700 30px Arial, Helvetica, sans-serif; }
      .small { fill:#0b1220; font:600 20px Arial, Helvetica, sans-serif; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="58" y="58" width="1484" height="784" rx="30" fill="none" stroke="#22304a"/>
  <text class="eyebrow" x="110" y="128">ASK</text>
  <text class="title" x="110" y="198">What we need next</text>
  <text class="body" x="110" y="260">The immediate need is not scale for scale’s sake. It is merchant access, pilot proof, and enough momentum to turn savings into repeatable revenue.</text>

  <rect x="110" y="356" width="620" height="280" rx="28" fill="#0f1a2d" stroke="#24324d"/>
  <text class="cardTitle" x="146" y="414">If we are talking to merchants</text>
  <text class="cardBody" x="146" y="468">• run a 4–8 week pilot</text>
  <text class="cardBody" x="146" y="510">• connect order flow to the API</text>
  <text class="cardBody" x="146" y="552">• review outcomes weekly</text>
  <text class="cardBody" x="146" y="594">• measure savings and false positives</text>

  <rect x="872" y="356" width="620" height="280" rx="28" fill="#0f1a2d" stroke="#24324d"/>
  <text class="cardTitle" x="908" y="414">If we are talking to investors</text>
  <text class="cardBody" x="908" y="468">• accelerate pilot onboarding</text>
  <text class="cardBody" x="908" y="510">• improve reliability and merchant reporting</text>
  <text class="cardBody" x="908" y="552">• build repeatable go-to-market capacity</text>
  <text class="cardBody" x="908" y="594">• convert early savings proof into paid growth</text>

  <rect x="110" y="714" width="1382" height="96" rx="22" fill="url(#accent)"/>
  <text class="big" x="146" y="764">Vector Pulse helps merchants stop shipping risky COD orders</text>
  <text class="small" x="146" y="796">and protect margin before the loss happens.</text>
</svg>
