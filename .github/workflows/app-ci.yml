name: App CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn redis httpx aiosqlite maxminddb-geolite2 asyncpg pytest pytest-asyncio

      - name: Run syntax checks
        run: |
          python -m py_compile api_gateway.py tests/test_api_gateway.py tests/test_frontend_contracts.py

      - name: Run unit and contract tests
        run: |
          python -m pytest tests/test_api_gateway.py tests/test_frontend_contracts.py --asyncio-mode=auto -v

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vector_pulse
          POSTGRES_USER: vector_pulse
          POSTGRES_PASSWORD: vector_pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vector_pulse -d vector_pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: .
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_SSL: "false"
      DATABASE_URL: postgresql://vector_pulse:vector_pulse@localhost:5432/vector_pulse
      ADMIN_SECRET_KEY: local-dev-admin-key
      VECTOR_PULSE_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install app and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-asyncio fastapi uvicorn redis httpx aiosqlite maxminddb-geolite2 asyncpg

      - name: Build Rust extension wheel
        run: |
          maturin build --release --out dist
          pip install dist/*.whl

      - name: Start API
        run: |
          nohup uvicorn api_gateway:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &

      - name: Wait for health endpoint
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "$VECTOR_PULSE_API_URL/health" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat uvicorn.log
          exit 1

      - name: Run live integration tests
        run: |
          pytest tests/integration_live.py --asyncio-mode=auto -v

  e2e-dashboard:
    runs-on: ubuntu-latest
    needs: integration-tests
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vector_pulse
          POSTGRES_USER: vector_pulse
          POSTGRES_PASSWORD: vector_pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vector_pulse -d vector_pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: .
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_SSL: "false"
      DATABASE_URL: postgresql://vector_pulse:vector_pulse@localhost:5432/vector_pulse
      ADMIN_SECRET_KEY: local-dev-admin-key
      VECTOR_PULSE_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install app and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-asyncio pytest-playwright fastapi uvicorn redis httpx aiosqlite maxminddb-geolite2 asyncpg
          python -m playwright install --with-deps chromium

      - name: Build Rust extension wheel
        run: |
          maturin build --release --out dist
          pip install dist/*.whl

      - name: Start API
        run: |
          nohup uvicorn api_gateway:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &

      - name: Wait for health endpoint
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "$VECTOR_PULSE_API_URL/health" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat uvicorn.log
          exit 1

      - name: Run Playwright dashboard tests
        run: |
          pytest tests/e2e/test_dashboard.py --asyncio-mode=auto -v
