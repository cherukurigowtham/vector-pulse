name: App CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vector_pulse
          POSTGRES_USER: vector_pulse
          POSTGRES_PASSWORD: vector_pulse
        ports:
          - 5432:5432
    env:
      ENVIRONMENT: test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_SSL: "false"
      DATABASE_URL: postgres://vector_pulse:vector_pulse@localhost:5432/vector_pulse?sslmode=disable
      JWT_SECRET: test-secret
      ADMIN_SECRET_KEY: test-admin-secret
      CORS_ALLOW_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify backend build and tests
        run: |
          go test ./...
          go build -o /tmp/vector-pulse ./cmd/server/main.go

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
