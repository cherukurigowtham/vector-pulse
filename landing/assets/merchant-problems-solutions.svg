<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="55%" stop-color="#0d1728"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132238"/>
      <stop offset="100%" stop-color="#0f1a2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <style>
      .title { fill:#f8fafc; font:700 42px Arial, Helvetica, sans-serif; letter-spacing:-0.5px; }
      .subtitle { fill:#94a3b8; font:400 19px Arial, Helvetica, sans-serif; }
      .section { fill:#e2e8f0; font:700 18px Arial, Helvetica, sans-serif; letter-spacing:1.2px; }
      .problem { fill:#f8fafc; font:700 24px Arial, Helvetica, sans-serif; }
      .body { fill:#cbd5e1; font:400 18px Arial, Helvetica, sans-serif; }
      .metric { fill:#67e8f9; font:700 16px Arial, Helvetica, sans-serif; letter-spacing:0.8px; }
      .tag { fill:#0b1220; font:700 14px Arial, Helvetica, sans-serif; letter-spacing:1px; }
      .flow { fill:#dbeafe; font:700 17px Arial, Helvetica, sans-serif; }
      .footer-label { fill:#93c5fd; font:700 18px Arial, Helvetica, sans-serif; }
      .footer-text { fill:#eff6ff; font:500 22px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1410" cy="120" r="220" fill="#0ea5e9" opacity="0.08"/>
  <circle cx="180" cy="760" r="260" fill="#38bdf8" opacity="0.06"/>

  <rect x="54" y="54" width="1492" height="792" rx="28" fill="none" stroke="#23314a"/>

  <text class="section" x="88" y="110">MERCHANT PAIN → PRODUCT VALUE</text>
  <text class="title" x="88" y="164">Why D2C merchants need Vector Pulse</text>
  <text class="subtitle" x="88" y="202">A premium pitch view of the most expensive COD and RTO problems, and how the product converts them into savings.</text>

  <rect x="88" y="252" width="448" height="208" rx="24" fill="url(#card)" stroke="#24324d" filter="url(#shadow)"/>
  <rect x="108" y="272" width="118" height="30" rx="15" fill="url(#accent)"/>
  <text class="tag" x="132" y="292">LOSS</text>
  <text class="problem" x="108" y="344">RTO and fake COD orders</text>
  <text class="body" x="108" y="382">Merchants ship orders that were never</text>
  <text class="body" x="108" y="408">likely to convert, then lose margin on</text>
  <text class="body" x="108" y="434">forward and return logistics.</text>
  <text class="metric" x="108" y="492">COD → Ship → Return → Margin loss</text>

  <rect x="576" y="252" width="448" height="208" rx="24" fill="url(#card)" stroke="#24324d" filter="url(#shadow)"/>
  <rect x="596" y="272" width="118" height="30" rx="15" fill="url(#accent)"/>
  <text class="tag" x="620" y="292">OPS</text>
  <text class="problem" x="596" y="344">Manual review does not scale</text>
  <text class="body" x="596" y="382">Ops teams cannot reliably inspect every</text>
  <text class="body" x="596" y="408">suspicious order during campaigns,</text>
  <text class="body" x="596" y="434">spikes, or high-COD periods.</text>
  <text class="metric" x="596" y="492">Order spike → Review bottleneck</text>

  <rect x="1064" y="252" width="448" height="208" rx="24" fill="url(#card)" stroke="#24324d" filter="url(#shadow)"/>
  <rect x="1084" y="272" width="118" height="30" rx="15" fill="url(#accent)"/>
  <text class="tag" x="1100" y="292">CONTROL</text>
  <text class="problem" x="1084" y="344">Generic rules hurt conversion</text>
  <text class="body" x="1084" y="382">Merchants want more prepaid on risky</text>
  <text class="body" x="1084" y="408">buyers, but blanket restrictions also</text>
  <text class="body" x="1084" y="434">block good COD demand.</text>
  <text class="metric" x="1084" y="492">Good buyer ≠ Risky buyer</text>

  <text class="section" x="88" y="548">HOW VECTOR PULSE RESPONDS</text>

  <rect x="88" y="580" width="1424" height="150" rx="26" fill="#0e1626" stroke="#24324d"/>
  <line x1="438" y1="606" x2="438" y2="704" stroke="#2a3a57"/>
  <line x1="808" y1="606" x2="808" y2="704" stroke="#2a3a57"/>
  <line x1="1158" y1="606" x2="1158" y2="704" stroke="#2a3a57"/>

  <text class="problem" x="118" y="636">1. Score each order in real time</text>
  <text class="body" x="118" y="670">Velocity, address reuse, anomaly,</text>
  <text class="body" x="118" y="696">trust, and IP checks run instantly.</text>

  <text class="problem" x="468" y="636">2. Separate safe from risky COD</text>
  <text class="body" x="468" y="670">Safe orders stay COD. Suspicious</text>
  <text class="body" x="468" y="696">orders are moved to prepaid.</text>

  <text class="problem" x="838" y="636">3. Explain the decision clearly</text>
  <text class="body" x="838" y="670">Ops teams see why an order was</text>
  <text class="body" x="838" y="696">flagged instead of using guesswork.</text>

  <text class="problem" x="1188" y="636">4. Tune by merchant profile</text>
  <text class="body" x="1188" y="670">Risk thresholds can be adjusted</text>
  <text class="body" x="1188" y="696">for each store’s behavior.</text>

  <rect x="88" y="760" width="1424" height="84" rx="22" fill="url(#accent)" opacity="0.95"/>
  <text class="footer-label" x="120" y="796">VALUE PROPOSITION</text>
  <text class="footer-text" x="120" y="826">Reduce risky COD shipments, protect margin, and force prepaid only where fraud risk is high.</text>

  <text class="flow" x="1042" y="798">Risky COD → FORCE_PREPAID</text>
  <text class="flow" x="1042" y="824">Safe COD → ALLOW_COD</text>
</svg>
