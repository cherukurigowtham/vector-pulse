<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <style>
      .eyebrow { fill:#93c5fd; font:700 18px Arial, Helvetica, sans-serif; letter-spacing:2px; }
      .title { fill:#f8fafc; font:700 56px Arial, Helvetica, sans-serif; letter-spacing:-1px; }
      .body { fill:#cbd5e1; font:400 21px Arial, Helvetica, sans-serif; }
      .cardTitle { fill:#f8fafc; font:700 22px Arial, Helvetica, sans-serif; }
      .cardBody { fill:#cbd5e1; font:400 18px Arial, Helvetica, sans-serif; }
      .decision { fill:#0b1220; font:700 22px Arial, Helvetica, sans-serif; }
      .caption { fill:#7dd3fc; font:700 16px Arial, Helvetica, sans-serif; letter-spacing:1px; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="58" y="58" width="1484" height="784" rx="30" fill="none" stroke="#22304a"/>
  <text class="eyebrow" x="110" y="128">SOLUTION</text>
  <text class="title" x="110" y="200">Vantix helps merchants decide</text>
  <text class="title" x="110" y="264">which COD orders are safe</text>
  <text class="body" x="110" y="328">The product evaluates each order before shipment, identifies risk patterns, and returns a simple operational decision.</text>

  <rect x="110" y="406" width="540" height="316" rx="26" fill="#0f1a2d" stroke="#24324d"/>
  <text class="caption" x="148" y="452">SIGNALS USED</text>
  <text class="cardTitle" x="148" y="504">Real-time fraud and delivery-risk checks</text>
  <text class="cardBody" x="148" y="548">• high order velocity</text>
  <text class="cardBody" x="148" y="584">• suspicious address reuse</text>
  <text class="cardBody" x="148" y="620">• order amount anomalies</text>
  <text class="cardBody" x="148" y="656">• weak customer trust history</text>
  <text class="cardBody" x="148" y="692">• risky IP signals</text>

  <rect x="708" y="406" width="724" height="316" rx="26" fill="#0e1626" stroke="#24324d"/>
  <text class="caption" x="748" y="452">OUTPUT</text>
  <rect x="748" y="510" width="280" height="88" rx="22" fill="#dbeafe"/>
  <text class="decision" x="812" y="563">ALLOW_COD</text>
  <rect x="1112" y="510" width="280" height="88" rx="22" fill="url(#accent)"/>
  <text class="decision" x="1142" y="563">FORCE_PREPAID</text>
  <text class="cardBody" x="748" y="640">Good orders remain frictionless for the buyer.</text>
  <text class="cardBody" x="1112" y="640">Suspicious orders are shifted to prepaid</text>
  <text class="cardBody" x="1112" y="672">before the merchant spends money on shipping.</text>

  <rect x="110" y="760" width="1322" height="66" rx="18" fill="url(#accent)"/>
  <text x="146" y="803" fill="#08111f" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
    Outcome: fewer risky COD shipments, lower manual review load, and better margin protection.
  </text>
</svg>
