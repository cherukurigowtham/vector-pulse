<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <style>
      .eyebrow { fill:#93c5fd; font:700 18px Arial, Helvetica, sans-serif; letter-spacing:2px; }
      .title { fill:#f8fafc; font:700 54px Arial, Helvetica, sans-serif; letter-spacing:-1px; }
      .body { fill:#cbd5e1; font:400 20px Arial, Helvetica, sans-serif; }
      .left { fill:#fca5a5; font:700 22px Arial, Helvetica, sans-serif; }
      .right { fill:#67e8f9; font:700 22px Arial, Helvetica, sans-serif; }
      .compare { fill:#e2e8f0; font:400 18px Arial, Helvetica, sans-serif; }
      .footer { fill:#dbeafe; font:600 24px Arial, Helvetica, sans-serif; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="58" y="58" width="1484" height="784" rx="30" fill="none" stroke="#22304a"/>
  <text class="eyebrow" x="110" y="128">POSITIONING</text>
  <text class="title" x="110" y="198">Why merchants choose us</text>
  <text class="body" x="110" y="260">The goal is not to sell “fraud AI.” The goal is to sell better COD decisions and lower avoidable loss.</text>

  <rect x="110" y="350" width="620" height="340" rx="28" fill="#0f1a2d" stroke="#24324d"/>
  <text class="left" x="150" y="410">What merchants do not want</text>
  <text class="compare" x="150" y="468">• a generic fraud platform with no COD focus</text>
  <text class="compare" x="150" y="516">• black-box flags that ops cannot explain</text>
  <text class="compare" x="150" y="564">• blanket prepaid rules that hurt conversion</text>
  <text class="compare" x="150" y="612">• heavy enterprise tooling built for much larger teams</text>

  <rect x="870" y="350" width="622" height="340" rx="28" fill="#0e1626" stroke="#24324d"/>
  <text class="right" x="910" y="410">What Vector Pulse offers</text>
  <text class="compare" x="910" y="468">• focused COD and RTO decisioning</text>
  <text class="compare" x="910" y="516">• explainable order-level decisions</text>
  <text class="compare" x="910" y="564">• selective prepaid enforcement</text>
  <text class="compare" x="910" y="612">• merchant-specific tuning for smaller D2C brands</text>

  <rect x="110" y="760" width="1382" height="64" rx="18" fill="url(#accent)"/>
  <text x="148" y="801" fill="#08111f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">
    Position the product as margin protection for COD-heavy merchants, not as generic fraud infrastructure.
  </text>
</svg>
