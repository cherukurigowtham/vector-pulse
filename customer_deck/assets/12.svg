<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <style>
      .eyebrow { fill:#93c5fd; font:700 18px Arial, Helvetica, sans-serif; letter-spacing:2px; }
      .title { fill:#f8fafc; font:700 54px Arial, Helvetica, sans-serif; letter-spacing:-1px; }
      .body { fill:#cbd5e1; font:400 21px Arial, Helvetica, sans-serif; }
      .big { fill:#dbeafe; font:600 28px Arial, Helvetica, sans-serif; }
      .cardTitle { fill:#67e8f9; font:700 20px Arial, Helvetica, sans-serif; letter-spacing:1px; }
      .cardBody { fill:#cbd5e1; font:400 18px Arial, Helvetica, sans-serif; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="170" r="220" fill="#38bdf8" opacity="0.08"/>
  <rect x="58" y="58" width="1484" height="784" rx="30" fill="none" stroke="#22304a"/>
  <text class="eyebrow" x="110" y="128">VISION</text>
  <text class="title" x="110" y="198">Start narrow, become strategic</text>
  <text class="body" x="110" y="260">The initial wedge is COD and RTO control. The longer-term vision is a broader decision layer for commerce risk.</text>

  <rect x="110" y="356" width="1382" height="164" rx="28" fill="#0e1626" stroke="#24324d"/>
  <text class="big" x="150" y="432">Today: help merchants answer one question before shipment</text>
  <text class="big" x="150" y="474">“Should this COD order be allowed, or should it be pushed to prepaid?”</text>

  <rect x="110" y="578" width="430" height="180" rx="26" fill="#0f1a2d" stroke="#24324d"/>
  <text class="cardTitle" x="146" y="628">STEP 1</text>
  <text class="cardBody" x="146" y="674">Build trust through real</text>
  <text class="cardBody" x="146" y="700">merchant savings.</text>

  <rect x="586" y="578" width="430" height="180" rx="26" fill="#0f1a2d" stroke="#24324d"/>
  <text class="cardTitle" x="622" y="628">STEP 2</text>
  <text class="cardBody" x="622" y="674">Expand into stronger</text>
  <text class="cardBody" x="622" y="700">checkout and order controls.</text>

  <rect x="1062" y="578" width="430" height="180" rx="26" fill="#0f1a2d" stroke="#24324d"/>
  <text class="cardTitle" x="1098" y="628">STEP 3</text>
  <text class="cardBody" x="1098" y="674">Evolve into a broader</text>
  <text class="cardBody" x="1098" y="700">commerce risk platform.</text>
</svg>
