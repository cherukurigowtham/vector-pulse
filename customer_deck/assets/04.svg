<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <style>
      .eyebrow { fill:#93c5fd; font:700 18px Arial, Helvetica, sans-serif; letter-spacing:2px; }
      .title { fill:#f8fafc; font:700 56px Arial, Helvetica, sans-serif; letter-spacing:-1px; }
      .body { fill:#cbd5e1; font:400 21px Arial, Helvetica, sans-serif; }
      .stepNum { fill:#67e8f9; font:700 28px Arial, Helvetica, sans-serif; }
      .stepTitle { fill:#f8fafc; font:700 22px Arial, Helvetica, sans-serif; }
      .stepBody { fill:#cbd5e1; font:400 17px Arial, Helvetica, sans-serif; }
      .footer { fill:#dbeafe; font:600 24px Arial, Helvetica, sans-serif; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="58" y="58" width="1484" height="784" rx="30" fill="none" stroke="#22304a"/>
  <text class="eyebrow" x="110" y="128">PRODUCT FLOW</text>
  <text class="title" x="110" y="200">How the product works</text>
  <text class="body" x="110" y="258">Vector Pulse fits into the existing merchant workflow as a real-time decision layer.</text>

  <line x1="190" y1="500" x2="1410" y2="500" stroke="#2d3d5b" stroke-width="4"/>

  <circle cx="190" cy="500" r="46" fill="#0f1a2d" stroke="#67e8f9" stroke-width="3"/>
  <circle cx="495" cy="500" r="46" fill="#0f1a2d" stroke="#67e8f9" stroke-width="3"/>
  <circle cx="800" cy="500" r="46" fill="#0f1a2d" stroke="#67e8f9" stroke-width="3"/>
  <circle cx="1105" cy="500" r="46" fill="#0f1a2d" stroke="#67e8f9" stroke-width="3"/>
  <circle cx="1410" cy="500" r="46" fill="#0f1a2d" stroke="#67e8f9" stroke-width="3"/>

  <text class="stepNum" x="178" y="510">1</text>
  <text class="stepNum" x="483" y="510">2</text>
  <text class="stepNum" x="788" y="510">3</text>
  <text class="stepNum" x="1093" y="510">4</text>
  <text class="stepNum" x="1398" y="510">5</text>

  <text class="stepTitle" x="108" y="608">Merchant sends order data</text>
  <text class="stepBody" x="108" y="638">Order payload is sent to</text>
  <text class="stepBody" x="108" y="662">the risk-check API.</text>

  <text class="stepTitle" x="408" y="608">Signals are evaluated</text>
  <text class="stepBody" x="408" y="638">Velocity, address, anomaly,</text>
  <text class="stepBody" x="408" y="662">trust, and IP checks run.</text>

  <text class="stepTitle" x="725" y="608">Risk score is calculated</text>
  <text class="stepBody" x="725" y="638">Signals are combined into</text>
  <text class="stepBody" x="725" y="662">a single decision score.</text>

  <text class="stepTitle" x="1013" y="608">Decision is returned</text>
  <text class="stepBody" x="1013" y="638">Merchant gets ALLOW_COD</text>
  <text class="stepBody" x="1013" y="662">or FORCE_PREPAID.</text>

  <text class="stepTitle" x="1322" y="608">Outcome is fed back</text>
  <text class="stepBody" x="1322" y="638">Delivery result updates</text>
  <text class="stepBody" x="1322" y="662">trust and tuning history.</text>

  <rect x="110" y="760" width="1320" height="64" rx="18" fill="url(#accent)"/>
  <text x="152" y="801" fill="#08111f" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
    The merchant does not need to rebuild checkout. They only need a decision layer before shipment or payment confirmation.
  </text>
</svg>
