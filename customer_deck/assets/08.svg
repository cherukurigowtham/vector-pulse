<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <style>
      .eyebrow { fill:#93c5fd; font:700 18px Arial, Helvetica, sans-serif; letter-spacing:2px; }
      .title { fill:#f8fafc; font:700 54px Arial, Helvetica, sans-serif; letter-spacing:-1px; }
      .body { fill:#cbd5e1; font:400 20px Arial, Helvetica, sans-serif; }
      .plan { fill:#f8fafc; font:700 26px Arial, Helvetica, sans-serif; }
      .price { fill:#67e8f9; font:700 40px Arial, Helvetica, sans-serif; }
      .cardBody { fill:#cbd5e1; font:400 17px Arial, Helvetica, sans-serif; }
      .mini { fill:#7dd3fc; font:700 15px Arial, Helvetica, sans-serif; letter-spacing:1px; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="58" y="58" width="1484" height="784" rx="30" fill="none" stroke="#22304a"/>
  <text class="eyebrow" x="110" y="128">BUSINESS MODEL</text>
  <text class="title" x="110" y="198">How we make money</text>
  <text class="body" x="110" y="260">The best early model is service-led SaaS: manual onboarding and tuning at first, recurring software revenue as usage grows.</text>

  <rect x="110" y="348" width="430" height="360" rx="28" fill="#0f1a2d" stroke="#24324d"/>
  <text class="mini" x="146" y="396">PHASE 1</text>
  <text class="plan" x="146" y="446">Pilot</text>
  <text class="price" x="146" y="506">Low fixed fee</text>
  <text class="cardBody" x="146" y="556">• manual onboarding</text>
  <text class="cardBody" x="146" y="590">• merchant-specific tuning</text>
  <text class="cardBody" x="146" y="624">• weekly review</text>
  <text class="cardBody" x="146" y="658">• proof of savings focus</text>

  <rect x="586" y="348" width="430" height="360" rx="28" fill="#0f1a2d" stroke="#24324d"/>
  <text class="mini" x="622" y="396">PHASE 2</text>
  <text class="plan" x="622" y="446">Growth</text>
  <text class="price" x="622" y="506">Monthly + usage</text>
  <text class="cardBody" x="622" y="556">• recurring platform fee</text>
  <text class="cardBody" x="622" y="590">• volume-based pricing</text>
  <text class="cardBody" x="622" y="624">• merchant risk profiles</text>
  <text class="cardBody" x="622" y="658">• operational dashboard</text>

  <rect x="1062" y="348" width="430" height="360" rx="28" fill="#0f1a2d" stroke="#24324d"/>
  <text class="mini" x="1098" y="396">PHASE 3</text>
  <text class="plan" x="1098" y="446">Managed</text>
  <text class="price" x="1098" y="506">Higher ACV</text>
  <text class="cardBody" x="1098" y="556">• premium support</text>
  <text class="cardBody" x="1098" y="590">• tuning assistance</text>
  <text class="cardBody" x="1098" y="624">• reporting and reviews</text>
  <text class="cardBody" x="1098" y="658">• stronger customer retention</text>

  <rect x="110" y="760" width="1382" height="64" rx="18" fill="url(#accent)"/>
  <text x="146" y="801" fill="#08111f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">
    Early revenue should come from pilots and managed onboarding, not from trying to be fully self-serve too soon.
  </text>
</svg>
