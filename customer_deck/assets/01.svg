<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <style>
      .eyebrow { fill:#93c5fd; font:700 18px Arial, Helvetica, sans-serif; letter-spacing:2px; }
      .title { fill:#f8fafc; font:700 78px Arial, Helvetica, sans-serif; letter-spacing:-1.5px; }
      .subtitle { fill:#dbeafe; font:600 32px Arial, Helvetica, sans-serif; }
      .body { fill:#94a3b8; font:400 22px Arial, Helvetica, sans-serif; }
      .footer { fill:#7dd3fc; font:600 18px Arial, Helvetica, sans-serif; }
      .chip { fill:#0b1220; font:700 15px Arial, Helvetica, sans-serif; letter-spacing:1px; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="170" r="220" fill="#0ea5e9" opacity="0.1"/>
  <circle cx="240" cy="780" r="260" fill="#38bdf8" opacity="0.07"/>
  <rect x="58" y="58" width="1484" height="784" rx="30" fill="none" stroke="#22304a"/>
  <rect x="110" y="120" width="162" height="34" rx="17" fill="url(#accent)"/>
  <text class="chip" x="139" y="142">FOUNDING DECK</text>
  <text class="eyebrow" x="110" y="205">VECTOR PULSE</text>
  <text class="title" x="110" y="320">Reduce risky COD</text>
  <text class="title" x="110" y="405">orders before shipment</text>
  <text class="subtitle" x="110" y="494">Real-time fraud and RTO control for Indian D2C merchants</text>
  <text class="body" x="110" y="560">A focused decision layer that helps merchants identify risky COD orders,</text>
  <text class="body" x="110" y="594">force prepaid only where needed, and protect contribution margin.</text>
  <rect x="110" y="654" width="620" height="96" rx="22" fill="#0f1a2d" stroke="#23314a"/>
  <text class="eyebrow" x="140" y="693">CORE OUTCOME</text>
  <text class="subtitle" x="140" y="732">Lower RTO loss without hurting healthy COD demand</text>
  <text class="footer" x="110" y="810">Founder name  |  email@example.com  |  +91 XXXXX XXXXX  |  yoursite.com</text>
</svg>
